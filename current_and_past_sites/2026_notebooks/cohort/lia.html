<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graduate Student Profile</title>

<style>
/* ---------- Global ---------------------------------------- */
body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#F2F3AE;                     /* Vanilla Custard */
    color:##3C1518;                         /* Rich Mahogany */
}

/* ---------- Container (the card) --------------------------- */
.container{
    max-width:800px;
    margin:3rem auto;
    padding:2.5rem 1.75rem;
    background:#D58936;                    /* slightly lighter dark */
    border-radius:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    text-align:center;
}

/* ---------- Profile photo --------------------------------- */
.profile-img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;                     /* circle */
    margin-bottom:1.25rem;
    border:4px solid #ff8c00;              /* orange “star” color */
}

/* ---------- Name ------------------------------------------- */
h1{
    font-size:2.5em;
    margin:0.3rem 0;
    color:#ff8c00;                         /* same accent as the border */
}

/* ---------- Favorite space fact ---------------------------- */
p.summary{
    font-size:1.1em;
    line-height:1.6;
    max-width:600px;
    margin:auto;
}

/* ---------- Responsive tweaks ------------------------------ */
@media (max-width:600px){
    .profile-img{ width:120px; height:120px; }
    h1{font-size:2em;}
}
</style>
</head>

<body>
<div class="container">
    <!-- Replace the placeholders below with actual data -->
    <img src="images/Lia.jpeg" alt="Student Photo" class="profile-img"/>
    <h1>Lia Mary Gilmore</h1>
    <p class="summary">Light does not experience time</p>
</div>
</body>
</html>
